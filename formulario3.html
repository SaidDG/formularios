<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-wesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- 3. Formulario con Área de Texto y Correo: Uso de <input type="email"> para validación de email y <textarea> para textos largos/multilínea -->
    <h2>Formulario con text area</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Ingresa tu correo:
        <input type="email" name="correo">
        <br>
        Ingresa tus comentarios:
        <textarea name="comentarios" rows="10" cols="30"></textarea>
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
<br>
    <a href="index.html">Volver al Menú Principal</a>
</body>
</html>
