<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-wesome/7.3.1/css/all.min.css">
</head>
<body>
     <!-- 6. Formulario con Menú de Selección: Uso de la etiqueta <select> con múltiples <option> para listas desplegables -->
    <h2>Formularios con seleccion</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Selecciona tu país:
        <select name="pais">
            <option value="1">Argentina</option>
            <option value="2">España</option>
            <option value="3">México</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select>
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
<br>
    <a href="index.html">Volver al Menú Principal</a>
</body>
</html>
