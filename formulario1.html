<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-wesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- 1. Formulario Básico: Uso de campo de texto (<input type="text">) y botón de envío (<input type="submit">) -->
    <h2>Ejemplo básico</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre" size="20">
        <br>
        <input type="submit" value="enviar">
    </form>
</body>
</html>
