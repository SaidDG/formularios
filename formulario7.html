<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-wesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- 7. Formulario con Botones Personalizados: Uso de la etiqueta <button> que permite incrustar elementos como íconos FontAwesome (<i>) -->
    <h2>Formulario con botones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
