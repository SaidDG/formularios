<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-wesome/7.3.1/css/all.min.css">

<body>
	<!-- 2. Formulario para Contraseñas: Campo de texto para usuario, campo 'password' para ocultar caracteres y botón 'reset' para limpiar el formulario -->
    <h2>Formulario para contraseñas</h2>
    <form action="" method="post">
        Ingresa tu usuario:
        <input type="text" name="usuario">
        <br>
        Ingresa tu contraseña:
        <input type="password" name="pass">
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
<br>
    <a href="index.html">Volver al Menú Principal</a>
</body>
</html>
