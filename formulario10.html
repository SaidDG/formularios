<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-wesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- 10. Formulario con Agrupamiento: Uso de <fieldset> para agrupar secciones de formularios y <legend> para sus respectivos títulos -->
    <h2>Formularios con agrupamiento</h2>
    <form action="" method="post">
        <fieldset>
            <legend>Datos personales</legend>
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>
            Documento válido:
            <input type="file" name="documento"><br>
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
        </fieldset>
        <fieldset>
            <legend>Datos de estudio:</legend>
            Nombre de la escuela:
            <input type="text" name="escuela"><br>
            Certificado válido:
            <input type="file" name="certificado"><br>
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
<br>
    <a href="index.html">Volver al Menú Principal</a>
</body>
</html>
