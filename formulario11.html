<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-wesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- 11. Formulario con Limitaciones: Demuestra el uso de 'disabled' (campo deshabilitado), 'maxlength' (límite de caracteres) y 'readonly' (solo lectura) -->
    <h2>Formulario con limitaciones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Deshabilitación de campo mediante el atributo disabled -->
        <input type="text" name="nombre" disabled><br>
        <!-- Limitación del número máximo de caracteres a 5 mediante maxlength -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br>
        <!-- Campo de texto de solo lectura mediante el atributo readonly -->
        Comentarios:
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>
</body>
</html>
